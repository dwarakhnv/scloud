{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#000000" id="theme-color-meta">
  <title>{% block title %}SCloud{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script>
    (function () {
      var theme = 'dark';
      try { theme = localStorage.getItem('scloud-theme') || 'dark'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% if messages %}
    <div class="container" style="padding-top:12px;padding-bottom:0;">
      <ul class="messages">
        {% for message in messages %}
          <li class="{{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>
    </div>
  {% endif %}
  {% block body %}{% endblock %}
  <script src="{% static 'js/app.js' %}"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
