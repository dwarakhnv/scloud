{% extends "base.html" %}
{% block title %}Reset Password - SCloud{% endblock %}
{% block body %}
<div class="login-wrap">
  <div class="login-card">
    <h1>Forgot password?</h1>
    <p class="subtitle">Enter your account email and we'll send you a reset link.</p>
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>Email</label>
        <input type="text" name="email" required autofocus>
      </div>
      <button type="submit" class="btn block">Send Reset Link</button>
    </form>
    <p style="margin-top:16px;"><a href="{% url 'accounts:login' %}" style="color:var(--accent);">Back to sign in</a></p>
  </div>
</div>
{% endblock %}
