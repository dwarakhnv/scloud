{% extends "base.html" %}
{% block title %}Check your email - SCloud{% endblock %}
{% block body %}
<div class="login-wrap">
  <div class="login-card">
    <h1>Check your email</h1>
    <p class="subtitle">If an account exists with that email, we've sent a link to reset your password.</p>
    <a class="btn block" href="{% url 'accounts:login' %}">Back to sign in</a>
  </div>
</div>
{% endblock %}
