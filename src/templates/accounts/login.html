{% extends "base.html" %}
{% block title %}Sign in - SCloud{% endblock %}
{% block body %}
<div class="login-wrap">
  <div class="login-card">
    <h1>SCloud</h1>
    <p class="subtitle">Your private media cloud</p>
    {% if form.errors %}
      <ul class="messages"><li class="error">Invalid username or password.</li></ul>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn block">Sign In</button>
      <input type="hidden" name="next" value="{{ next }}">
    </form>
    <p style="margin-top:16px;"><a href="{% url 'accounts:password_reset' %}" style="color:var(--accent);">Forgot password?</a></p>
  </div>
</div>
{% endblock %}
